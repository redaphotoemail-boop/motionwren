<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MotionWren Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Turn listing photos into a cinematic property video in minutes. Add price, beds and baths from your listing link. Built for busy agents.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: centered single column, one idea per screen; the film player is the one bold, dark object. */
:root{
  --paper:#F4F5F2; --surface:#FFFFFF; --ink:#14161A; --muted:#61666E; --line:#E2E4DF;
  --dusk:#1C2440; --amber:#E9A23B; --amber-ink:#93560A; --screen:#0B0D12; --on-screen:#F3F1EC;
  --display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body:"Geist", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"Geist Mono", ui-monospace, Menlo, monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1014; --surface:#161920; --ink:#F1F1EC; --muted:#9BA1A9; --line:#252932;
  --dusk:#C8D2F2; --amber:#F0AE4E; --amber-ink:#F0AE4E; --screen:#05070A; --on-screen:#F3F1EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1014; --surface:#161920; --ink:#F1F1EC; --muted:#9BA1A9; --line:#252932;
  --dusk:#C8D2F2; --amber:#F0AE4E; --amber-ink:#F0AE4E; --screen:#05070A; --on-screen:#F3F1EC; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.025em;text-wrap:balance;margin:0}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{appearance:none;border:0;cursor:pointer;font:600 15px/1 var(--body);padding:15px 22px;border-radius:999px;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;gap:10px;text-decoration:none;transition:transform .2s ease, opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,.drop:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.amber{background:var(--amber);color:#1a1206}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font:700 21px/1 var(--display);letter-spacing:-.03em;text-decoration:none}
.navlinks{display:flex;gap:28px;align-items:center;font-size:14px;color:var(--muted)}
.navlinks a{text-decoration:none}.navlinks a:hover{color:var(--ink)}
.navlinks .btn{padding:11px 18px;font-size:14px;color:var(--paper)}
@media (max-width:720px){.navlinks a:not(.btn){display:none}}

/* hero */
.hero{text-align:center;padding-block:72px 40px}
.hero h1{font-size:clamp(46px,8.4vw,112px);line-height:.95;font-weight:600}
.hero h1 em{font-style:normal;color:var(--amber-ink)}
.hero p{font-size:clamp(18px,2vw,21px);color:var(--muted);max-width:30ch;margin:22px auto 30px}
.hero .ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hero .fine{font-size:13px;color:var(--muted);margin-top:16px}

/* film player */
.film{position:relative;max-width:1120px;margin:56px auto 0;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:var(--screen);color:var(--on-screen);box-shadow:0 40px 90px -40px rgba(20,22,40,.55)}
.film.v{aspect-ratio:9/16;max-width:360px}.film.s{aspect-ratio:1/1;max-width:560px}
.frame{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.frame.on{opacity:1}
.frame img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:var(--ox,50%) var(--oy,50%)}
.frame.on img{animation:var(--move,push) 4.2s linear forwards}
@keyframes push{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
@keyframes pull{from{transform:scale(1.16) translate(1%,0)}to{transform:scale(1.03) translate(0,0)}}
@keyframes pan{from{transform:scale(1.12) translate(3%,0)}to{transform:scale(1.12) translate(-3%,0)}}
@keyframes rise{from{transform:scale(1.12) translate(0,3%)}to{transform:scale(1.08) translate(0,-2%)}}
.film .hud{position:absolute;inset:0;pointer-events:none;padding:clamp(14px,2.4vw,26px);display:flex;flex-direction:column;justify-content:space-between}
.hud .top{display:flex;justify-content:space-between;font:500 12px/1 var(--mono);letter-spacing:.08em;opacity:.85}
.rec{display:inline-flex;gap:8px;align-items:center}.rec i{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.card{align-self:flex-start;background:rgba(12,14,20,.58);backdrop-filter:blur(14px);border-radius:14px;padding:14px 18px;transform:translateY(16px);opacity:0;transition:all .8s cubic-bezier(.2,.8,.2,1);max-width:min(380px,80%)}
.card.show{transform:none;opacity:1}
.card .addr{font:600 clamp(15px,1.7vw,19px)/1.2 var(--display)}
.card .price{font:600 clamp(20px,2.6vw,30px)/1.1 var(--display);color:var(--amber);margin-top:4px}
.card .spec{font:500 clamp(10px,2.4vw,12px)/1 var(--mono);letter-spacing:.06em;opacity:.8;margin-top:10px;white-space:nowrap}
.room{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.bar{position:absolute;left:0;bottom:0;height:3px;background:var(--amber);width:0}
.wm{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(28px,6vw,70px)/1 var(--display);letter-spacing:.2em;color:rgba(255,255,255,.14);pointer-events:none;transform:rotate(-12deg)}

/* sections */
section,header{scroll-margin-top:84px}
section{padding-block:clamp(80px,12vw,150px)}
.center{text-align:center}
.lede{font-size:clamp(34px,5vw,64px);line-height:1.02}
.sub{color:var(--muted);font-size:19px;max-width:34ch;margin:18px auto 0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:64px;text-align:left}
.steps .n{font:500 13px/1 var(--mono);color:var(--amber-ink)}
.steps h3{font-size:26px;margin-top:14px}
.steps p{color:var(--muted);margin:8px 0 0}
@media (max-width:760px){.steps{grid-template-columns:1fr;gap:32px}}

/* studio */
#studio{padding-block:clamp(60px,9vw,110px)}
.studio{background:var(--surface);border-radius:28px;padding:clamp(20px,4vw,48px);margin-top:48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(24px,4vw,56px);text-align:left}
@media (max-width:900px){.studio{grid-template-columns:1fr}.stage{order:-1}}
.track{display:flex;gap:6px;margin-bottom:28px}
.track span{flex:1;height:3px;border-radius:3px;background:var(--line)}
.track span.done{background:var(--ink)}
.pane h3{font-size:30px}
.pane .hint{color:var(--muted);margin:8px 0 22px;font-size:16px}
.drop{border-radius:18px;background:var(--paper);padding:26px;text-align:center;cursor:pointer;transition:background .2s}
.drop.over{background:color-mix(in srgb,var(--amber) 18%,var(--paper))}
.drop strong{display:block;font:600 17px/1.3 var(--display)}
.drop small{color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.thumb{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--paper);cursor:grab}
.thumb:active{cursor:grabbing}
.thumb.dragging{opacity:.4}
.thumb.over{box-shadow:inset 0 0 0 3px var(--amber)}
.thumb img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.thumb button{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.thumb .i{position:absolute;left:6px;bottom:5px;font:500 10px/1 var(--mono);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tag{display:inline-block;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:12px}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=url]{width:100%;font:500 16px var(--body);color:var(--ink);background:var(--paper);border:0;border-radius:12px;padding:14px 16px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.urlrow{display:flex;gap:8px}.urlrow input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:0;cursor:pointer;background:var(--paper);color:var(--ink);font:500 14px var(--body);padding:11px 16px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle input{width:44px;height:26px;appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle input:checked{background:var(--amber)}.toggle input:checked::after{transform:translateX(18px)}
.actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.ok{font:500 13px var(--mono);color:var(--amber-ink);margin-top:10px;min-height:18px}
.stage{display:flex;flex-direction:column;gap:14px;min-width:0;justify-content:center}
.stage .film{margin:0;width:100%}
.stage .film.v{align-self:center;width:min(100%,300px)}
.stage .film.s{align-self:center;width:min(100%,460px)}
.meta{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--muted);flex-wrap:wrap;gap:8px}
.render{display:grid;gap:12px;margin-top:6px}
.render div{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:15px}
.render div b{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);flex:none}
.render div.on{color:var(--ink)}.render div.on b{box-shadow:inset 0 0 0 2px var(--amber);animation:spin 1s linear infinite;border-top:2px solid transparent}
.render div.done{color:var(--ink)}.render div.done b{background:var(--amber);box-shadow:none}
@keyframes spin{to{transform:rotate(360deg)}}
/* music audition + payment */
.mlist{display:grid;gap:8px;margin-top:4px}
.mopt{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;border:0;font:inherit;color:inherit}
.mopt[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.mplay{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);cursor:pointer;flex:none;display:grid;place-items:center;font-size:12px}
.mplay[aria-pressed="true"]{background:var(--amber);color:#1a1206}
.mplay.off{visibility:hidden}
.mnm{font-weight:600;font-size:15px}
.mdesc{color:var(--muted);font-size:13px;margin-left:auto}
.mcheck{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);flex:none}
.mopt[aria-checked="true"] .mcheck{background:var(--amber);box-shadow:none}
.mopt:focus-visible,.mplay:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.summary{background:var(--paper);border-radius:14px;padding:16px 18px;display:grid;gap:9px;margin:4px 0 18px}
.summary .li{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.summary .li span:first-child{color:var(--muted)}
.summary .tot{border-top:1px solid var(--line);padding-top:11px;margin-top:3px;font:600 22px/1 var(--display);align-items:baseline}
.secure{font:500 12px var(--mono);color:var(--muted);margin-top:12px;display:flex;gap:7px;align-items:center}
.contact{background:var(--paper);border-radius:12px;padding:14px 16px;margin-top:14px;font-size:14px;line-height:1.6;color:var(--muted)}
.contact b{color:var(--ink);font-weight:600;-webkit-user-select:all;user-select:all}
.paid{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--amber-ink);margin-top:10px}

/* formats */
.formats{display:flex;gap:clamp(14px,3vw,36px);justify-content:center;align-items:flex-end;margin-top:56px;flex-wrap:wrap}
.formats figure{margin:0;text-align:center}
.formats .film{margin:0;box-shadow:0 30px 60px -36px rgba(20,22,40,.5)}
.formats figcaption{font:500 12px var(--mono);color:var(--muted);margin-top:14px;letter-spacing:.06em}
.f169{width:min(520px,88vw)}.f916{width:min(190px,40vw)}.f11{width:min(280px,52vw)}

/* details */
.split>*,.steps>*,.plans>*{min-width:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,90px);align-items:center}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.split .lede{text-align:left}.split .sub{margin-left:0}
.paste{margin-top:30px;background:var(--surface);border-radius:16px;padding:16px 18px;font:500 14px var(--mono);color:var(--muted);display:flex;align-items:center;gap:12px;overflow:hidden}
.paste span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.arrow{color:var(--amber-ink)}

/* studio teaser + pop-out modal */
.teaser{margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:26px}
.teaser .film{margin:0;width:100%;max-width:860px}
.btn.big{font-size:17px;padding:17px 32px}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;-webkit-overflow-scrolling:touch;background:rgba(10,12,18,.6);backdrop-filter:blur(10px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:26px;width:min(1040px,100%);margin:auto;overflow:hidden;box-shadow:0 50px 130px -30px rgba(0,0,0,.65);animation:pop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.sheetbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:15px 18px 15px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheetlogo{display:flex;align-items:center;gap:9px;font:700 16px var(--display);letter-spacing:-.02em}
.x{width:38px;height:38px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:background .15s}
.x:hover{background:var(--line)}
.x:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.modal .studio{margin:0;border-radius:0;padding:clamp(20px,3.6vw,44px)}
.sheet.narrow{width:min(540px,100%)}
.subbody{padding:clamp(20px,4vw,34px);text-align:left}
.subdone{text-align:center;padding:14px 4px}
.subdone h3{font:600 26px var(--display);margin:10px 0 6px}
.subdone p{color:var(--muted);margin:0 auto;max-width:34ch}
.subdone .actions{justify-content:center}
/* Content Studio: questions, analysis, package */
.plan-pill{margin:22px auto 0;display:inline-flex;align-items:center;gap:8px;background:transparent;border:0;cursor:pointer;color:var(--amber-ink);font:600 15px var(--body);padding:9px 6px}
.plan-pill:hover{text-decoration:underline}
.plan-pill:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:8px}
.planbody{padding:clamp(20px,3.6vw,44px);text-align:left}
.qhead{margin-bottom:22px}
.qhead h3{font-size:clamp(23px,3vw,32px);margin-top:8px}
.qhead .hint{color:var(--muted);margin:8px 0 0;font-size:16px;max-width:54ch;line-height:1.5}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:620px){.qgrid{grid-template-columns:repeat(2,1fr)}}
.qcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:14px;background:var(--paper);border:0;border-radius:16px;padding:18px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .15s,box-shadow .15s}
.qcard:hover{transform:translateY(-2px)}
.qcard[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.qcard svg{width:28px;height:28px;stroke:var(--ink);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.qcard[aria-pressed="true"] svg{stroke:var(--amber-ink)}
.qlabel{font:600 15px/1.2 var(--display)}
.qtick{position:absolute;top:13px;right:13px;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line)}
.qcard[aria-pressed="true"] .qtick{background:var(--amber);box-shadow:none}
.qcard:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.qother{margin-top:12px}
.scan{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;margin-bottom:24px;background:var(--screen)}
.scan img{width:100%;height:100%;object-fit:cover;opacity:.65}
.scan::after{content:"";position:absolute;left:0;right:0;height:38%;top:-38%;background:linear-gradient(180deg,rgba(233,162,59,.55),rgba(233,162,59,0));animation:scan 1.9s linear infinite}
@keyframes scan{to{top:100%}}
.pkg{display:grid;gap:10px;margin-top:4px}
.pkg-item{display:flex;align-items:center;gap:15px;background:var(--paper);border:0;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;border-radius:14px;padding:15px 16px;opacity:0;transform:translateY(8px);animation:pkgin .45s forwards;transition:opacity .15s}
.pkg-item[aria-pressed="false"]{opacity:.45}
.pkg-item:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
@keyframes pkgin{to{opacity:1;transform:none}}
.pkg-item svg{width:24px;height:24px;stroke:var(--amber-ink);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pkg-item .pm{min-width:0;flex:1}
.pkg-item .pt{font:600 16px var(--display)}
.pkg-item .pmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pkg-item .pmeta span{font:500 11px var(--mono);background:var(--surface);padding:3px 9px;border-radius:99px;color:var(--muted)}
.pkg-item .pprice{font:600 16px var(--display);font-variant-numeric:tabular-nums;flex:none}
.pkg-item .pcheck{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);flex:none}
.pkg-item[aria-pressed="true"] .pcheck{background:var(--amber);box-shadow:none}
.pkg-sum{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px}
.pkg-price{font:600 32px/1 var(--display);font-variant-numeric:tabular-nums}
.pkg-price small{font:500 14px var(--body);color:var(--muted)}
.saveline{color:var(--amber-ink);font:600 13px var(--mono);margin-top:4px}
@media (prefers-reduced-motion:reduce){.sheet,.pkg-item{animation:none;opacity:1;transform:none}.scan::after{animation:none;display:none}}
/* pricing */
.ptier{margin-top:44px;text-align:left}
.ptier-head{text-align:center;margin-bottom:26px}
.ptier-head h3{font-size:clamp(26px,3.4vw,34px);margin-top:10px}
.ptier-head p{color:var(--muted);margin:8px auto 0;max-width:40ch}
.solo{max-width:460px;margin:0 auto}
.plans2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.6vw,28px);max-width:860px;margin:0 auto}
@media (max-width:760px){.plans2{grid-template-columns:1fr}}
.pdiv{display:flex;align-items:center;gap:18px;max-width:620px;margin:52px auto 0;color:var(--muted);font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.pdiv::before,.pdiv::after{content:"";flex:1;height:1px;background:var(--line)}
.per{font:600 14px/1 var(--mono);color:var(--amber-ink);margin-top:-2px}
.plan .plan-sub{opacity:.7;font-size:15px;margin-top:8px}

function Film(el,opts){

  const layer=document.createElement('div');el.appendChild(layer);
  const hud=document.createElement('div');hud.className='hud';
  hud.innerHTML='<div class="top"><span class="rec"><i></i><span class="room"></span></span><span class="tc">00:00:00:00</span></div><div class="card"><div class="addr"></div><div class="price"></div><div class="spec"></div></div>';
  el.appendChild(hud);
  const bar=document.createElement('div');bar.className='bar';el.appendChild(bar);
  let wm=null;
  const card=hud.querySelector('.card'),room=hud.querySelector('.room'),tc=hud.querySelector('.tc');
  function setListing(l){card.querySelector('.addr').textContent=l.addr;card.querySelector('.price').textContent=l.price;card.querySelector('.spec').textContent=l.spec;}
  setListing(opts.listing);
  function load(list){
    layer.innerHTML='';frames=list.map((p,k)=>{const f=document.createElement('div');f.className='frame';
      f.style.setProperty('--move',MOVES[k%MOVES.length]);
      const im=new Image();im.alt=p.label||'Listing photo';im.src=p.src;f.appendChild(im);layer.appendChild(f);return {f,label:p.label||('Scene '+(k+1))};});
    i=0;show(0);
  }
  function show(k){
    frames.forEach((x,j)=>x.f.classList.toggle('on',j===k));
    const fr=frames[k];if(!fr)return;
    // restart the camera move
    const im=fr.f.querySelector('img');im.style.animation='none';void im.offsetWidth;im.style.animation='';
    room.textContent=fr.label;
    card.classList.toggle('show',opts.card&&(k===0||k===frames.length-1));
  }
  function tick(){
    const total=frames.length*opts.interval,el2=(performance.now()-t0)%total;
    const s=el2/1000,f=Math.floor((s%1)*24);
    tc.textContent='00:00:'+String(Math.floor(s)).padStart(2,'0')+':'+String(f).padStart(2,'0');
    bar.style.width=(el2/total*100)+'%';
    raf=requestAnimationFrame(tick);
  }
  function play(){stop();t0=performance.now();i=0;show(0);
    if(!reduced){timer=setInterval(()=>{i=(i+1)%frames.length;show(i);if(i===0)t0=performance.now();},opts.interval);raf=requestAnimationFrame(tick);}}
  function stop(){clearInterval(timer);cancelAnimationFrame(raf);}
  return {load,play,stop,setListing,
    setCard(v){opts.card=v;show(i);},
    setWatermark(v){if(v&&!wm){wm=document.createElement('div');wm.className='wm';wm.textContent='PREVIEW';el.appendChild(wm);}if(!v&&wm){wm.remove();wm=null;}},
    setInterval(ms){opts.interval=ms;play();}};
}

/* Drag to reorder photo thumbnails (used in both the studio and Content Studio uploaders) */
function makeSortable(container,arr,onChange){
  let dragEl=null;
  container.querySelectorAll('.thumb').forEach((el,idx)=>{
    el.setAttribute('draggable','true');el.dataset.idx=idx;
    el.addEventListener('dragstart',e=>{dragEl=el;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',idx);}catch(_){}} );
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');dragEl=null;container.querySelectorAll('.thumb').forEach(t=>t.classList.remove('over'));});
    el.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';});
    el.addEventListener('dragenter',e=>{e.preventDefault();if(el!==dragEl)el.classList.add('over');});
    el.addEventListener('dragleave',()=>el.classList.remove('over'));
    el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');
      if(!dragEl||dragEl===el)return;
      const from=+dragEl.dataset.idx,to=+el.dataset.idx;const [m]=arr.splice(from,1);arr.splice(to,0,m);onChange();});
  });
}

/* --- music audition: short synthesized motifs so you can hear each style before choosing.
   BACKEND: swap these for real licensed / ElevenLabs sample clips (<audio src=…> per style). --- */
let actx=null,playingOsc=null,playingBtn=null;
const MOTIFS={Warm:{wave:'sine',notes:[0,4,7,12,7,4],step:.42,g:.16},Upbeat:{wave:'triangle',notes:[0,7,12,16,12,7,9],step:.2,g:.14},Luxe:{wave:'sine',notes:[0,3,7,10,14,10,7],step:.5,g:.17}};
function stopMusic(){if(playingOsc){playingOsc.forEach(o=>{try{o.stop()}catch(e){}});playingOsc=null;}if(playingBtn){playingBtn.setAttribute('aria-pressed','false');playingBtn=null;}}
function playMusic(style,btn){
  if(playingBtn===btn){stopMusic();return;}
  stopMusic();if(style==='None')return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const m=MOTIFS[style]||MOTIFS.Warm,base=196;let t=actx.currentTime+.04;playingOsc=[];
  m.notes.forEach((semi,i)=>{const o=actx.createOscillator(),g=actx.createGain(),st=t+i*m.step;
    o.type=m.wave;o.frequency.value=base*Math.pow(2,semi/12);
    g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(m.g,st+.04);g.gain.exponentialRampToValueAtTime(.0001,st+m.step*1.5);
    o.connect(g).connect(actx.destination);o.start(st);o.stop(st+m.step*1.6);playingOsc.push(o);});
  btn.setAttribute('aria-pressed','true');playingBtn=btn;
  const dur=(m.notes.length*m.step+.3)*1000;setTimeout(()=>{if(playingBtn===btn)stopMusic();},dur);
}

function run(){
  /* BACKEND: wired — real photos upload at render time (final order), then submit → generate → poll → deliver. Demo animation when signed out, offline, or on sample photos. */
  const $=id=>document.getElementById(id);
  const demo=()=>{const rows=[...document.querySelectorAll('#render div')];let k=0;
    const nxt=()=>{rows.forEach((r,j)=>{r.className=j<k?'done':j===k?'on':'';});
      if(k>=rows.length){if(run.done)run.done();return;}
      k++;setTimeout(nxt,reduced?150:850);};
    nxt();};
  const realPhotos=S.photos.filter(p=>!p.sample);
  if(realPhotos.length<2){demo();return;}
  (async()=>{
    const unavailable=res=>{if(res.status===401||res.status>=500){demo();return true;}return false;};
    try{
      const changed=S.listing.addr!==LISTING.addr;
      const digits=v=>(v||'').replace(/\D/g,'');
      $('rt').textContent='Uploading your photos…';
      const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:changed?S.listing.addr:'MotionWren video',listingAddress:changed?S.listing.addr:'',price:S.listing.price!==LISTING.price?digits(S.listing.price):'',aspect:S.format==='9:16'?'vertical':S.format==='1:1'?'cinematic':'horizontal',targetDuration:S.length==='15'?20:S.length==='60'?50:30})});
      const d=await r.json().catch(()=>({}));if(!r.ok){if(unavailable(r))return;throw new Error(d.error||'The project could not be created.');}
      const pid=d.project.id;S.projectId=pid;
      const shots=realPhotos.slice(0,20);
      for(let i=0;i<shots.length;i++){const p=shots[i];const blob=await(await fetch(p.src)).blob();const ext=blob.type==='image/png'?'png':'jpg';const fd=new FormData();fd.append('file',new File([blob],(p.label||'photo')+'.'+ext,{type:blob.type||'image/jpeg'}));const u=await fetch('/api/projects/'+pid+'/assets',{method:'POST',body:fd});const ud=await u.json().catch(()=>({}));if(!u.ok){if(unavailable(u))return;throw new Error(ud.error||('Photo '+(i+1)+' could not be stored.'));}}
      $('rt').textContent='Submitting…';
      const s=await fetch('/api/projects/'+pid,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'submit'})});
      const sd=await s.json().catch(()=>({}));
      if(!s.ok){if(s.status===402){$('rt').textContent='A video credit is required.';$('rh').textContent=sd.error||'Add a video credit, then start production from your dashboard.';return;}if(unavailable(s))return;throw new Error(sd.error||'The project could not be submitted.');}
      $('rt').textContent='Starting production…';
      const g=await fetch('/api/projects/'+pid+'/generate',{method:'POST'});const gd=await g.json().catch(()=>({}));if(!g.ok){if(unavailable(g))return;throw new Error(gd.error||'Production could not start.');}
      $('rt').textContent='Creating scenes…';
      const started=Date.now();
      while(Date.now()-started<20*60*1000){
        await new Promise(res=>setTimeout(res,10000));
        const pr=await fetch('/api/projects/'+pid,{cache:'no-store'});const pd=await pr.json().catch(()=>({}));if(!pr.ok){if(unavailable(pr))return;throw new Error(pd.error||'Production status could not be read.');}
        const st=pd.project&&pd.project.status;
        if(st==='completed'){S.downloadUrl=pd.project.finalHistoryId?('/api/history/'+pd.project.finalHistoryId+'/video?download=1'):null;if(run.done)run.done();return;}
        if(st==='failed')throw new Error('Production failed. Your project is saved in your dashboard.');
      }
      $('rt').textContent='Still rendering…';$('rh').textContent='This one is taking a while. Find it in your dashboard when it is ready.';
    }catch(e){
      if(e instanceof TypeError){demo();return;}
      $('rt').textContent='Could not start production.';$('rh').textContent=(e&&e.message)||'Your photos are safe — try again from your dashboard.';
    }
  })();
}

const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]||''}</svg>`;
const QS=[
 {key:'goal',multi:false,title:"What's this video for?",hint:"Pick the moment you're marketing.",opts:[['listed','Just listed','flag'],['sold','Just sold','sold'],['open','Open house','door'],['price','Price change','pricedown'],['luxury','Luxury showcase','diamond'],['rent','For rent','key'],['other','Something else','other']]},
 {key:'prop',multi:false,title:"What kind of property?",hint:"So the pacing fits the home.",opts:[['single','Single-family','home'],['condo','Condo / apartment','building'],['estate','Luxury estate','estate'],['multi','Multi-family','multi'],['land','Land / lot','land'],['commercial','Commercial','commercial'],['other','Other','other']]},
 {key:'channels',multi:true,title:"Where will you post it?",hint:"Choose all that apply — we'll size everything to fit.",opts:[['instagram','Instagram','instagram'],['tiktok','TikTok','tiktok'],['mls','MLS / listing','mls'],['youtube','YouTube','youtube'],['facebook','Facebook','facebook'],['email','Email','email'],['other','Somewhere else','other']]},
 {key:'vibe',multi:false,title:"Set the mood.",hint:"We'll match the music and motion to it.",opts:[['warm','Warm & inviting','sun'],['modern','Sleek & modern','square'],['luxe','Luxe & cinematic','film'],['bright','Bright & energetic','spark']]}];
const LB={listed:'just-listed',sold:'just-sold',open:'open-house',price:'price-change',luxury:'luxury',rent:'rental',single:'single-family home',condo:'condo',estate:'luxury estate',multi:'multi-family property',land:'lot',commercial:'commercial space'};
const CHL={instagram:'Instagram',tiktok:'TikTok',mls:'MLS',youtube:'YouTube',facebook:'Facebook',email:'Email',other:'Other'};
function listJoin(a){return a.length<=1?(a[0]||''):a.length===2?a[0]+' and '+a[1]:a.slice(0,-1).join(', ')+' and '+a.slice(-1);}
function tagsFor(list,ch,fb){const s=list.filter(x=>ch.includes(x)).map(x=>CHL[x]);return s.length?s:(fb?[CHL[list[0]]]:[]);}
function recommend(P){const ch=P.channels,estate=P.prop==='estate'||P.goal==='luxury',items=[];
 items.push({icon:'video',title:'Hero listing film',price:39,meta:[(estate?60:30)+' sec','16:9'],tags:tagsFor(['mls','youtube','email'],ch,true)});
 if(ch.includes('instagram')||ch.includes('tiktok'))items.push({icon:'reel',title:'Vertical reel',price:19,meta:['20 sec','9:16','hook + captions'],tags:tagsFor(['instagram','tiktok'],ch,true)});
 if(ch.includes('instagram'))items.push({icon:'story',title:'Story teaser',price:9,meta:['10 sec','9:16'],tags:['Instagram']});
 if(ch.includes('instagram')||ch.includes('facebook'))items.push({icon:'post',title:'Feed post set',price:19,meta:['3 cards','1:1'],tags:tagsFor(['instagram','facebook'],ch,true)});
 const g={listed:'"Just Listed" graphic',sold:'"Just Sold" graphic',open:'Open-house invite',price:'"New Price" graphic',luxury:'Luxury feature card',rent:'"For Rent" flyer'};
 items.push({icon:'graphic',title:g[P.goal]||'Announcement graphic',price:12,meta:['Image','1:1 + 9:16'],tags:ch.length?['Social']:['Download']});
 if(ch.includes('email')||ch.includes('mls'))items.push({icon:'cover',title:'Listing cover image',price:9,meta:['Thumbnail','16:9'],tags:tagsFor(['email','mls'],ch,true)});
 return items;}
const P={step:0,goal:null,prop:null,channels:[],vibe:null,photos:sample.slice()};
const planModal=document.getElementById('planModal'),planBody=document.getElementById('planBody');
function closePlan(){planModal.hidden=true;document.body.style.overflow='';toParent('mw:close');}
function ptrack(){return '<div class="track">'+Array.from({length:7},(_,k)=>'<span class="'+(k<=P.step?'done':'')+'"></span>').join('')+'</div>';}
function planRender(){
  const $=id=>document.getElementById(id);
  if(P.step<4){
    const q=QS[P.step],ok=q.key+'Other',sel=v=>q.multi?P.channels.includes(v):P[q.key]===v,can=()=>q.multi?P.channels.length>0:!!P[q.key];
    const otherOn=()=>q.multi?P.channels.includes('other'):P[q.key]==='other';
    planBody.innerHTML=`${ptrack()}<div class="qhead"><div class="eyebrow">Question ${P.step+1} of 4</div><h3>${q.title}</h3><p class="hint">${q.hint}</p></div>
    <div class="qgrid">${q.opts.map(([v,label,icon])=>`<button type="button" class="qcard" data-v="${v}" aria-pressed="${sel(v)}">${ic(icon)}<span class="qlabel">${label}</span><span class="qtick"></span></button>`).join('')}</div>
    <input type="text" class="qother" id="qother" placeholder="Tell us a bit more…" value="${(P[ok]||'').replace(/"/g,'&quot;')}" ${otherOn()?'':'hidden'}>
    <div class="actions">${P.step>0?'<button class="btn ghost" id="pback" type="button">Back</button>':''}<button class="btn" id="pnext" type="button">Continue</button></div>`;
    $('pnext').disabled=!can();
    $('qother').oninput=e=>{P[ok]=e.target.value;};
    planBody.querySelectorAll('.qcard').forEach(c=>c.onclick=()=>{const v=c.dataset.v;
      if(q.multi){const i=P.channels.indexOf(v);i>=0?P.channels.splice(i,1):P.channels.push(v);c.setAttribute('aria-pressed',P.channels.includes(v));}
      else{P[q.key]=v;planBody.querySelectorAll('.qcard').forEach(x=>x.setAttribute('aria-pressed',x===c));}
      const qo=$('qother');qo.hidden=!otherOn();if(!qo.hidden&&v==='other')qo.focus();
      $('pnext').disabled=!can();});
    if($('pback'))$('pback').onclick=()=>{P.step--;planRender();};
    $('pnext').onclick=()=>{if(can()){P.step++;planRender();}};
  } else if(P.step===4){
    planBody.innerHTML=`${ptrack()}<div class="qhead"><div class="eyebrow">Almost there</div><h3>Add your listing photos</h3><p class="hint">Drag them in and we'll analyze what we can make from them.</p></div>
    <div class="drop" id="pdrop" tabindex="0" role="button" aria-label="Add photos"><strong>Drag photos here</strong><small>or click to choose · JPG or PNG</small><input type="file" id="pfile" accept="image/jpeg,image/png" multiple hidden></div>
    <div class="thumbs" id="pthumbs"></div><div class="tag" id="ptag2"></div>
    <div class="actions"><button class="btn ghost" id="pback" type="button">Back</button><button class="btn amber" id="panalyze" type="button">Analyze my photos</button></div>`;
    const drop=$('pdrop'),file=$('pfile');
    const paint=()=>{$('pthumbs').innerHTML=P.photos.map((p,k)=>`<div class="thumb"><img src="${p.src}" alt="" draggable="false"><span class="i">${String(k+1).padStart(2,'0')}</span></div>`).join('');
      $('ptag2').textContent=(P.photos.some(p=>p.sample)?'Sample photos · ':'')+P.photos.length+' photos'+(P.photos.length>1?' · drag to reorder':'');
      makeSortable($('pthumbs'),P.photos,paint);};
    const add=files=>{const list=[...files].filter(f=>/image\/(jpe?g|png)/.test(f.type)).slice(0,28);if(!list.length)return;if(P.photos.every(p=>p.sample))P.photos=[];let left=list.length;list.forEach(f=>{const r=new FileReader();r.onload=()=>{P.photos.push({src:r.result});if(--left===0)paint();};r.readAsDataURL(f);});
      /* BACKEND: wired — store photos on a draft 'Content package' project so the order keeps them; failures stay local-only. */
      (async()=>{try{
        if(!P.projectId){const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'Content package'})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'project');P.projectId=d.project.id;}
        for(const f of list){try{const fd=new FormData();fd.append('file',f);const u=await fetch('/api/projects/'+P.projectId+'/assets',{method:'POST',body:fd});const ud=await u.json().catch(()=>({}));if(u.ok&&ud.asset){const p=P.photos.find(x=>!x.assetId);if(p)p.assetId=ud.asset.id;}}catch(e){}}
      }catch(e){}})();};
    drop.onclick=()=>file.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click();}};
    file.onchange=()=>add(file.files);
    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
    drop.addEventListener('drop',e=>add(e.dataTransfer.files));
    paint();$('pback').onclick=()=>{P.step=3;planRender();};$('panalyze').onclick=()=>{P.step=5;planRender();};
  } else if(P.step===5){
    const steps=['Reading your '+P.photos.length+' photos','Finding your best shots','Matching to your '+(LB[P.goal]||'listing')+' goal','Sizing for '+(P.channels.map(c=>CHL[c]).join(', ')||'every channel'),'Planning your content package'];
    planBody.innerHTML=`<div class="qhead"><div class="eyebrow">Analyzing</div><h3>Building your package…</h3><p class="hint">This takes a few seconds.</p></div>
    <div class="scan"><img src="${P.photos[0].src}" alt=""></div>
    <div class="render" id="prender">${steps.map(t=>'<div><b></b>'+t+'</div>').join('')}</div>`;
    const rows=[...planBody.querySelectorAll('#prender div')];let k=0;
    const nx=()=>{rows.forEach((r,j)=>r.className=j<k?'done':j===k?'on':'');if(k>=rows.length){P.step=6;planRender();return;}k++;setTimeout(nx,reduced?150:900);};nx();
  } else {
    const items=recommend(P);items.forEach(it=>it.sel=true);
    const chL=P.channels.map(c=>CHL[c]);
    const rationale=`For a ${LB[P.goal]||'listing'} ${LB[P.prop]||''} ${chL.length?'going to '+listJoin(chL):'ready for any channel'}, here's what we'd make. Keep the whole package, or pick just what you want:`;
    planBody.innerHTML=`${ptrack()}<div class="qhead"><div class="eyebrow">Recommended for you</div><h3>Your content package</h3><p class="hint">${rationale}</p></div>
    <div class="pkg">${items.map((it,i)=>`<button type="button" class="pkg-item" data-i="${i}" aria-pressed="true" style="animation-delay:${i*60}ms">${ic(it.icon)}<div class="pm"><div class="pt">${it.title}</div><div class="pmeta">${it.meta.concat(it.tags).map(m=>'<span>'+m+'</span>').join('')}</div></div><span class="pprice">$${it.price}</span><span class="pcheck"></span></button>`).join('')}</div>
    <div class="pkg-sum"><div><div class="pkg-price" id="pkgPrice"></div><div class="saveline" id="saveLine"></div></div>
    <div class="actions" style="margin:0"><button class="btn ghost" id="predo" type="button">Start over</button><button class="btn amber" id="pcreate" type="button">Create this package</button></div></div>`;
    const upd=()=>{const s=items.filter(i=>i.sel),sum=s.reduce((a,i)=>a+i.price,0),all=items.length>0&&items.every(i=>i.sel),total=all?Math.round(sum*0.85):sum;
      $('pkgPrice').innerHTML=`$${total}<small> · ${s.length} ${s.length===1?'piece':'pieces'}</small>`;
      $('saveLine').textContent=all?`Full package — you save $${sum-total}`:(s.length?'Add the rest to save 15%':'Pick at least one piece');
      const cb=$('pcreate');cb.disabled=!s.length;cb.textContent=all?'Create this package':'Create selected';};
    planBody.querySelectorAll('.pkg-item').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i];it.sel=!it.sel;b.setAttribute('aria-pressed',it.sel);upd();});
    upd();
    $('predo').onclick=()=>{P.step=0;P.goal=P.prop=P.vibe=null;P.channels=[];planRender();};
    $('pcreate').onclick=()=>{planModal.hidden=true;/* BACKEND: the host creates the order from this event (see the site's mw:package listener). Total is 15% off when the whole package is selected. */
    const sel=items.filter(i=>i.sel),sum=sel.reduce((a,i)=>a+i.price,0),total=items.length&&items.every(i=>i.sel)?Math.round(sum*0.85):sum;
    toParent('mw:package',{items:sel,answers:{goal:P.goal,prop:P.prop,channels:P.channels,vibe:P.vibe},total:total});openStudio();};
  }
}
function openPlan(){planModal.hidden=false;document.body.style.overflow='hidden';planRender();planModal.querySelector('.x').focus();}
document.getElementById('closePlan').onclick=closePlan;
planModal.addEventListener('click',e=>{if(e.target===planModal)closePlan();});


/* ---------- Host glue: the host page opens a flow and hears when it closes ---------- */
function toParent(type,data){try{if(window.parent!==window)window.parent.postMessage(Object.assign({type:type},data||{}),'*');}catch(e){}}
function openFlow(f){if(f==='plan')openPlan();else openStudio();}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='mw:open')openFlow(d.flow);});
(function(){const f=new URLSearchParams(location.search).get('flow');if(f)openFlow(f);})();
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!planModal.hidden)closePlan();else if(!modal.hidden)closeStudio();});
})();
</script>
</body></html>
